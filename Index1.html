<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine? 💘</title>
  <style>
    :root{
      --bg1:#ff9a9e;
      --bg2:#fad0c4;
      --card:#ffffffcc;
      --text:#1f1f1f;
      --yes:#22c55e;
      --no:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      overflow:hidden;
    }
    .hearts{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.35;
      background-image:
        radial-gradient(circle at 20% 30%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 80% 40%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 40% 70%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 60% 20%, #fff 0 2px, transparent 3px);
      filter: blur(.2px);
      animation: floatBg 8s ease-in-out infinite;
    }
    @keyframes floatBg{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }

    .card{
      width:min(560px, 92vw);
      padding:28px 22px;
      border-radius:24px;
      background:var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      text-align:center;
      position:relative;
    }
    .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:#fff;
      font-weight:600;
      box-shadow:0 10px 25px rgba(0,0,0,.1);
      margin-bottom:14px;
    }
    h1{
      margin:10px 0 6px;
      font-size: clamp(26px, 4.5vw, 38px);
      line-height:1.15;
    }
    p{
      margin:0 0 18px;
      font-size: clamp(14px, 2.7vw, 16px);
      opacity:.85;
    }

    .name{
      font-weight:800;
      background: linear-gradient(90deg, #ff3d6e, #7c3aed);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .btnRow{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:16px;
    }
    button{
      border:0;
      padding:14px 18px;
      border-radius:14px;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      transition: transform .08s ease, filter .15s ease;
      user-select:none;
    }
    button:active{transform: scale(.98)}
    .yes{
      background: linear-gradient(180deg, #34d399, var(--yes));
      color:white;
      box-shadow:0 12px 28px rgba(34,197,94,.35);
    }
    .yes:hover{filter:brightness(1.02)}
    .no{
      background: linear-gradient(180deg, #fb7185, var(--no));
      color:white;
      box-shadow:0 12px 28px rgba(239,68,68,.30);
      position:relative;
    }

    .footer{
      margin-top:14px;
      font-size:12px;
      opacity:.7;
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      display:none;
      place-items:center;
      background: rgba(0,0,0,.35);
      padding:18px;
    }
    .modal.open{display:grid}
    .modalBox{
      width:min(520px, 94vw);
      border-radius:24px;
      background:white;
      padding:22px;
      text-align:center;
      box-shadow:0 18px 70px rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
    }
    .modalBox h2{margin:8px 0 6px}
    .modalBox p{margin:0 0 14px}
    .close{
      background:#111827;
      color:white;
      padding:12px 16px;
      border-radius:14px;
      font-weight:700;
    }

    /* Confetti (simple) */
    .confetti{
      position:fixed;
      width:10px; height:14px;
      top:-20px;
      border-radius:2px;
      opacity:.9;
      animation: fall linear forwards;
      pointer-events:none;
    }
    @keyframes fall{
      to{
        transform: translateY(calc(100vh + 40px)) rotate(540deg);
        opacity:1;
      }
    }
  </style>
</head>
<body>
  <div class="hearts"></div>

  <main class="card" aria-live="polite">
    <div class="badge">💌 A tiny question…</div>
    <h1>
      Hey <span class="name" id="gfName">my love</span>,<br/>
      will you be my Valentine? 💘
    </h1>
    <p id="subtext">I promise cuddles, snacks, and endless love 😌</p>

    <div class="btnRow">
      <button class="yes" id="yesBtn">Yes! 🥰</button>
      <button class="no" id="noBtn">No 🙃</button>
    </div>

    <div class="footer">Tip: You can edit the name at the top of the code.</div>
  </main>

  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modalBox">
      <div style="font-size:42px">🎉💖</div>
      <h2 id="modalTitle">YAY!!</h2>
      <p>Best Valentine ever 💘</p>
      <button class="close" id="closeBtn">Close</button>
    </div>
  </section>

  <script>
    // ✅ Change her name here:
    const HER_NAME = "Vanshika"; // <- edit if you want

    const gfNameEl = document.getElementById("gfName");
    gfNameEl.textContent = HER_NAME;

    const modal = document.getElementById("modal");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const closeBtn = document.getElementById("closeBtn");
    const subtext = document.getElementById("subtext");

    const funnyTexts = [
      "Are you sure? 🥺",
      "Think again 😌",
      "I’ll be sad… 😭",
      "What if I bring chocolates? 🍫",
      "Okay but… please? 🥹",
      "Last chance 😤💖",
      "You can’t escape love 😈"
    ];
    let noCount = 0;

    function openModal(){
      modal.classList.add("open");
    }
    function closeModal(){
      modal.classList.remove("open");
    }

    function burstConfetti(){
      const pieces = 80;
      for(let i=0;i<pieces;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
        c.style.transform = `translateY(-20px) rotate(${Math.random()*360}deg)`;
        c.style.background = `hsl(${Math.floor(Math.random()*360)}, 90%, 60%)`;
        c.style.width = (8 + Math.random()*8) + "px";
        c.style.height = (10 + Math.random()*12) + "px";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(), 4500);
      }
    }

    yesBtn.addEventListener("click", () => {
      subtext.textContent = "I knew it 😌💖";
      openModal();
      burstConfetti();
    });

    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if(e.target === modal) closeModal();
    });

    // Make the No button dodge after a couple tries (playful)
    function dodge(){
      const card = document.querySelector(".card");
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = cardRect.width - btnRect.width - 10;
      const maxY = cardRect.height - btnRect.height - 10;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("click", () => {
      noCount++;
      subtext.textContent = funnyTexts[noCount % funnyTexts.length];

      // After first click, start dodging
      if(noCount >= 1) dodge();

      // Also make YES button grow slightly each time
      const scale = 1 + Math.min(noCount * 0.08, 0.8);
      yesBtn.style.transform = `scale(${scale})`;
    });

    // Optional: dodge when hovering (desktop)
    noBtn.addEventListener("mouseenter", () => {
      if(noCount >= 1) dodge();
    });
  </script>
</body>
</html>
